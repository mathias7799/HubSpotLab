AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HandoffReady API

Parameters:
  PublicUrl:
    Type: String
  HubSpotClientId:
    Type: String
    NoEcho: true
  HubSpotClientSecret:
    Type: String
    NoEcho: true
  TokenEncryptionKey:
    Type: String
    NoEcho: true
  UpstashRedisRestUrl:
    Type: String
    NoEcho: true
  UpstashRedisRestToken:
    Type: String
    NoEcho: true

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
  Function:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Handler: dist/aws-lambda.handler
      CodeUri: ..
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          NODE_ENV: production
          PUBLIC_URL: !Ref PublicUrl
          HUBSPOT_CLIENT_ID: !Ref HubSpotClientId
          HUBSPOT_CLIENT_SECRET: !Ref HubSpotClientSecret
          HUBSPOT_SCOPES: oauth crm.objects.deals.read
          TOKEN_ENCRYPTION_KEY: !Ref TokenEncryptionKey
          UPSTASH_REDIS_REST_URL: !Ref UpstashRedisRestUrl
          UPSTASH_REDIS_REST_TOKEN: !Ref UpstashRedisRestToken
          ALLOW_UNSIGNED_DEVELOPMENT_REQUESTS: "false"
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
