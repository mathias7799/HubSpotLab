name: Release SpotKit

on:
  workflow_dispatch:
  push:
    tags:
      - "spotkit-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/spotkit test
      - run: pnpm --dir tools/spotkit typecheck
      - run: pnpm --dir tools/spotkit build
      - name: Verify release tag and package version
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(node -p "require('./tools/spotkit/package.json').version")"
          test "spotkit-v${VERSION}" = "${GITHUB_REF_NAME}"
      - run: pnpm --dir tools/spotkit pack --pack-destination /tmp
      - run: pnpm --dir tools/spotkit publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
