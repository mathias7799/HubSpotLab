name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @hubspotlab/tidshub-api build
      - run: pnpm --dir tools/spotkit build
      - name: Verify packed SpotKit artifact
        run: |
          mkdir -p /tmp/spotkit-pack
          pnpm --dir tools/spotkit pack --pack-destination /tmp/spotkit-pack
          pnpm dlx /tmp/spotkit-pack/*.tgz create ci-packed-app --directory /tmp --api-origin https://api.ci-packed-app.com
          pnpm dlx /tmp/spotkit-pack/*.tgz add webhooks /tmp/ci-packed-app
          pnpm dlx /tmp/spotkit-pack/*.tgz doctor /tmp/ci-packed-app --strict
          pnpm --dir /tmp/ci-packed-app install
          pnpm --dir /tmp/ci-packed-app test
          pnpm --dir /tmp/ci-packed-app typecheck
          pnpm --dir /tmp/ci-packed-app build
